server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ================= AUTH SERVICE =================
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # ================= USER SERVICE =================
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # ================= BENEFICIARY SERVICE =================
        - id: beneficiary-service
          uri: lb://BENEFICIARY-SERVICE
          predicates:
            - Path=/api/beneficiaries/**

        # ================= REQUESTS (in BENEFICIARY-SERVICE) =================
        - id: requests-service
          uri: lb://BENEFICIARY-SERVICE
          predicates:
            - Path=/api/requests/**

        # ================= ADMIN ENDPOINTS =================
        - id: admin-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/admin/**

        # ================= DONATION SERVICE (.NET - External) =================
        - id: donation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/donations/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
